<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CalcPro 3D — Admin</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #000000;
    --panel: #0E0E0F;
    --panel-2: #141416;
    --panel-3: #1A1A1D;
    --line: rgba(255,255,255,.09);
    --line-2: rgba(255,255,255,.16);
    --ink: #FFFFFF;
    --muted: #9A9AA0;
    --muted-2: #6C6C72;
    --acid: #C5F230;
    --acid-dim: rgba(197,242,48,.13);
    --acid-line: rgba(197,242,48,.4);
    --display: "Archivo Black", "Archivo", system-ui, sans-serif;
    --sans: "Archivo", system-ui, -apple-system, sans-serif;
    --mono: "Geist Mono", ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-weight: 400; line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input { font-family: inherit; }
  ::selection { background: var(--acid); color: #000; }
  .acid { color: var(--acid); }

  /* LOGIN */
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .login-card {
    width: 100%; max-width: 400px; background: var(--panel); border: 1px solid var(--line-2); padding: 40px 36px;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
  }
  .login-logo { font-family: var(--display); font-size: 22px; text-transform: uppercase; text-align: center; margin-bottom: 8px; }
  .login-sub { text-align: center; font-size: 14px; color: var(--muted); margin-bottom: 28px; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
  .field-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .input {
    width: 100%; font-size: 15px; font-weight: 500; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line-2); padding: 13px 16px;
    transition: border-color .15s;
  }
  .input:focus { outline: none; border-color: var(--acid); box-shadow: 0 0 0 3px rgba(197,242,48,.15); }
  .input::placeholder { color: var(--muted-2); }
  .btn-acid {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--acid); color: #0A0E00; font-family: var(--mono); font-weight: 600;
    font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase;
    padding: 14px 24px; border: none; cursor: pointer; transition: all .15s; margin-top: 8px;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
  }
  .btn-acid:hover { background: #d4ff44; }
  .btn-acid:disabled { opacity: .5; cursor: not-allowed; }
  .login-error { font-size: 13px; color: #ff6b73; text-align: center; margin-top: 12px; display: none; }
  .login-error.show { display: block; }

  /* DASHBOARD */
  .dash { max-width: 1200px; margin: 0 auto; padding: 0 28px 60px; display: none; }
  .dash.show { display: block; }

  .dash-topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 22px 0; border-bottom: 1px solid var(--line); margin-bottom: 28px; flex-wrap: wrap;
  }
  .dash-logo { font-family: var(--display); font-size: 20px; text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
  .dash-logo .mk { width: 34px; height: 34px; background: var(--acid); color: #000; display: grid; place-items: center; }
  .dash-logo .mk svg { width: 19px; height: 19px; }
  .dash-tag { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--acid); background: var(--acid-dim); border: 1px solid var(--acid-line); padding: 5px 12px; }
  .dash-right { display: flex; align-items: center; gap: 12px; }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--mono); font-weight: 600; font-size: 12px;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 10px 16px; border: 1px solid var(--line-2); background: var(--panel-2);
    color: var(--ink); transition: all .15s;
  }
  .btn-ghost:hover { border-color: var(--acid-line); color: var(--acid); }
  .btn-danger:hover { border-color: #ff6b73; color: #ff6b73; }

  /* STATS */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 28px; }
  .stat-card { background: var(--panel); border: 1px solid var(--line); padding: 22px 24px; }
  .stat-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .stat-val { font-family: var(--display); font-size: 36px; color: var(--acid); margin-top: 8px; }
  @media (max-width: 600px) { .stats { grid-template-columns: 1fr; } }

  /* SEARCH */
  .search-bar {
    display: flex; gap: 12px; margin-bottom: 20px; align-items: center; flex-wrap: wrap;
  }
  .search-input {
    flex: 1; min-width: 200px; font-size: 14px; color: var(--ink);
    background: var(--panel); border: 1px solid var(--line-2); padding: 11px 16px;
    font-family: var(--sans); transition: border-color .15s;
  }
  .search-input:focus { outline: none; border-color: var(--acid); }
  .search-input::placeholder { color: var(--muted-2); }
  .lead-count { font-family: var(--mono); font-size: 12px; color: var(--muted-2); letter-spacing: 0.06em; }

  /* TABLE */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left; padding: 12px 16px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); border-bottom: 1px solid var(--line-2); background: var(--panel);
    position: sticky; top: 0;
  }
  tbody td {
    padding: 14px 16px; font-size: 14px; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody tr:hover { background: var(--panel); }
  .td-name { font-weight: 600; }
  .td-email { color: var(--acid); }
  .td-whatsapp { font-family: var(--mono); font-size: 13px; }
  .td-date { font-family: var(--mono); font-size: 12px; color: var(--muted); }

  .empty-state {
    text-align: center; padding: 60px 20px; color: var(--muted-2);
    font-family: var(--mono); font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase;
  }

  .btn-del {
    background: none; border: 1px solid rgba(240,69,77,.3); color: #ff6b73;
    font-size: 13px; padding: 5px 10px; cursor: pointer; transition: all .15s;
    font-family: var(--mono);
  }
  .btn-del:hover { background: rgba(240,69,77,.15); border-color: #ff6b73; }

  .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--line-2); border-top-color: var(--acid); border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginView">
  <div class="login-card">
    <div class="login-logo">CALC<span class="acid">PRO 3D</span></div>
    <p class="login-sub">Painel administrativo</p>

    <div class="field">
      <label class="field-label">E-mail</label>
      <input class="input" type="email" id="loginEmail" placeholder="admin@custoprint.com" />
    </div>
    <div class="field">
      <label class="field-label">Senha</label>
      <input class="input" type="password" id="loginPass" placeholder="Sua senha" onkeydown="if(event.key==='Enter')doLogin()" />
    </div>
    <button class="btn-acid" id="loginBtn" onclick="doLogin()">Entrar</button>
    <p class="login-error" id="loginError"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dash" id="dashView">
  <header class="dash-topbar">
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <div class="dash-logo">
        <span class="mk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="6" rx="1"/><path d="M6 14H4a2 2 0 0 1-2-2v-1a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v1a2 2 0 0 1-2 2h-2"/><rect x="7" y="13" width="10" height="8" rx="1"/></svg></span>
        CALC<span class="acid">PRO 3D</span>
      </div>
      <span class="dash-tag">Admin</span>
    </div>
    <div class="dash-right">
      <button class="btn-ghost" onclick="exportCSV()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><polyline points="7 11 12 16 17 11"/><path d="M4 20h16"/></svg>
        Exportar CSV
      </button>
      <button class="btn-ghost" onclick="loadLeads()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        Atualizar
      </button>
      <button class="btn-ghost btn-danger" onclick="doLogout()">Sair</button>
    </div>
  </header>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Total de leads</div>
      <div class="stat-val" id="statTotal">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Hoje</div>
      <div class="stat-val" id="statToday">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Ultimos 7 dias</div>
      <div class="stat-val" id="stat7d">-</div>
    </div>
  </div>

  <div class="search-bar">
    <input class="search-input" type="text" id="searchInput" placeholder="Buscar por nome, e-mail ou WhatsApp..." oninput="filterLeads()" />
    <span class="lead-count" id="leadCount"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Nome</th>
          <th>E-mail</th>
          <th>WhatsApp</th>
          <th>Consentimento</th>
          <th>Data</th>
          <th>LGPD</th>
        </tr>
      </thead>
      <tbody id="leadsBody">
        <tr><td colspan="6" class="loading"><span class="spinner"></span> Carregando...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script>
  let allLeads = [];

  async function init() {
    try {
      const session = await getSession();
      if (session) {
        showDash();
        loadLeads();
      }
    } catch {}
  }

  function showDash() {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('dashView').classList.add('show');
  }

  async function doLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    const errEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');

    if (!email || !pass) { errEl.textContent = 'Preencha todos os campos'; errEl.classList.add('show'); return; }

    btn.disabled = true;
    btn.textContent = 'Entrando...';
    errEl.classList.remove('show');

    try {
      await loginAdmin(email, pass);
      showDash();
      loadLeads();
    } catch (err) {
      errEl.textContent = 'E-mail ou senha incorretos';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  }

  async function doLogout() {
    await logoutAdmin();
    window.location.reload();
  }

  async function loadLeads() {
    const body = document.getElementById('leadsBody');
    body.innerHTML = '<tr><td colspan="6" class="loading"><span class="spinner"></span> Carregando...</td></tr>';

    try {
      allLeads = await getLeads();
      updateStats();
      renderLeads(allLeads);
    } catch (err) {
      body.innerHTML = '<tr><td colspan="6" class="empty-state">Erro ao carregar leads: ' + err.message + '</td></tr>';
    }
  }

  function updateStats() {
    const now = new Date();
    const todayStr = now.toISOString().slice(0, 10);
    const weekAgo = new Date(now - 7 * 86400000).toISOString();

    document.getElementById('statTotal').textContent = allLeads.length;
    document.getElementById('statToday').textContent = allLeads.filter(l => l.created_at && l.created_at.slice(0, 10) === todayStr).length;
    document.getElementById('stat7d').textContent = allLeads.filter(l => l.created_at && l.created_at >= weekAgo).length;
  }

  function renderLeads(leads) {
    const body = document.getElementById('leadsBody');
    document.getElementById('leadCount').textContent = leads.length + ' lead' + (leads.length !== 1 ? 's' : '');

    if (leads.length === 0) {
      body.innerHTML = '<tr><td colspan="6" class="empty-state">Nenhum lead encontrado</td></tr>';
      return;
    }

    body.innerHTML = '';
    leads.forEach(l => {
      const date = l.created_at ? new Date(l.created_at).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
      const consent = l.consent_at ? new Date(l.consent_at).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="td-name">${esc(l.nome)}</td>
        <td class="td-email">${esc(l.email)}</td>
        <td class="td-whatsapp">${esc(l.whatsapp)}</td>
        <td class="td-date">${consent}</td>
        <td class="td-date">${date}</td>
        <td></td>`;
      const btn = document.createElement('button');
      btn.className = 'btn-del';
      btn.title = 'Excluir dados (LGPD)';
      btn.innerHTML = '&#x2715;';
      btn.addEventListener('click', () => removeLeadLGPD(l.id, l.nome));
      tr.lastElementChild.appendChild(btn);
      body.appendChild(tr);
    });
  }

  function filterLeads() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim();
    if (!q) { renderLeads(allLeads); return; }
    const filtered = allLeads.filter(l =>
      (l.nome || '').toLowerCase().includes(q) ||
      (l.email || '').toLowerCase().includes(q) ||
      (l.whatsapp || '').toLowerCase().includes(q)
    );
    renderLeads(filtered);
  }

  function exportCSV() {
    if (allLeads.length === 0) return;
    const header = 'Nome,E-mail,WhatsApp,Data';
    const rows = allLeads.map(l => {
      const date = l.created_at ? new Date(l.created_at).toLocaleString('pt-BR') : '';
      return [csvCell(l.nome), csvCell(l.email), csvCell(l.whatsapp), csvCell(date)].join(',');
    });
    const csv = [header, ...rows].join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'leads-calcpro3d-' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
  }

  function csvCell(v) {
    v = String(v || '');
    if (v.includes(',') || v.includes('"') || v.includes('\n')) return '"' + v.replace(/"/g, '""') + '"';
    return v;
  }

  async function removeLeadLGPD(id, nome) {
    if (!confirm('LGPD — Excluir permanentemente os dados de "' + String(nome || '') + '"?\n\nEssa acao nao pode ser desfeita.')) return;
    try {
      await deleteLead(id);
      allLeads = allLeads.filter(l => l.id !== id);
      updateStats();
      renderLeads(allLeads);
    } catch (err) {
      alert('Erro ao excluir: ' + err.message);
    }
  }

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  init();
</script>
</body>
</html>
